[package]
name = "midnight-shield-auction"
version = "0.1.0"
edition = "2021"
description = "MidnightShield - Privacy-Preserving Auction Protocol for Midnight Network"
license = "MIT"
repository = "https://github.com/midnight-shield/auction-protocol"

[lib]
name = "midnight_shield_auction"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Cryptographic primitives
blake3 = "1.8"
sha2 = "0.10"
secp256k1 = { version = "0.29", features = ["recovery"] }

# Serialization
borsh = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Midnight ZK circuits
midnight-circuits = "7.2"
midnight-zk-stdlib = "2.3"

# WASM bindings
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"

# Logging
log = "0.4"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[features]
default = ["wasm"]
wasm = []
